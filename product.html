<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Piece — MISCHIEF</title>
<meta name="description" content="A piece from Mischief Drop 01.">
<meta name="theme-color" content="#070708">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23ff2d20%22/><text x=%2250%22 y=%2272%22 font-size=%2268%22 font-family=%22Impact,Arial Black%22 fill=%22%23fff%22 text-anchor=%22middle%22>M</text></svg>">
<link rel="preload" href="assets/fonts/big-shoulders-display.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="loader" id="loader" aria-hidden="true">
  <div class="loader__logo">MISCH<span>IEF</span></div>
  <p class="loader__note mono">Opening the showroom</p>
  <div class="loader__count">000</div>
  <div class="loader__bar"><i></i></div>
</div>

<canvas id="stage" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>

<main id="view" data-view="product">
  <div class="product-stage">
    <img class="product-fallback" data-fallback alt="" width="800" height="1000">
    <div class="product-stage__tools">
      <button class="btn btn--line btn--sm" type="button" data-flip>Show back</button>
      <p class="drag-cue mono" style="position:static">Drag to turn</p>
    </div>
  </div>

  <article class="panel" data-ui>
    <div class="panel__head">
      <a class="link" href="shop.html" style="justify-self:start">← The Drop</a>
      <p class="eyebrow"><span data-no></span>&nbsp;—&nbsp;<span data-category></span></p>
      <h1 class="display" data-name></h1>
      <p class="panel__price" data-price></p>
    </div>
    <p class="panel__desc" data-desc></p>

    <div class="field">
      <span class="label">Colour</span>
      <span class="field__value"><i class="dot" data-swatch></i><span data-color></span></span>
    </div>

    <div class="field">
      <span class="label">Size</span>
      <div class="sizes" data-sizes role="group" aria-label="Size"></div>
    </div>

    <div class="buy">
      <div class="qty">
        <button type="button" data-qty-minus aria-label="One fewer">−</button>
        <span data-qty-value>1</span>
        <button type="button" data-qty-plus aria-label="One more">+</button>
      </div>
      <button class="btn btn--solid" type="button" data-add>Add to bag</button>
    </div>
    <a class="btn btn--line" data-customize hidden href="customize.html">Customize in the Studio</a>

    <ul class="details" data-details></ul>

    <a class="next" data-next href="shop.html">
      <span class="label">Next piece</span>
      <strong data-next-name></strong>
    </a>
  </article>
</main>

<noscript><p style="padding:140px 24px;color:#efece6;font-family:sans-serif">Mischief's showroom needs JavaScript to run.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
