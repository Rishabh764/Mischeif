<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Drop — SLANG STUDIO</title>
<meta name="description" content="Drop 01: ten Slang Studio pieces on one rack. Hoodies, tees, a bomber, cargos and accessories.">
<meta name="theme-color" content="#efebe4">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23ff2d20%22/><text x=%2250%22 y=%2272%22 font-size=%2268%22 font-family=%22Impact,Arial Black%22 fill=%22%23fff%22 text-anchor=%22middle%22>S</text></svg>">
<link rel="preload" href="assets/fonts/big-shoulders-display.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="loader" id="loader" aria-hidden="true">
  <div class="loader__logo">SLANG <span>STUDIO</span></div>
  <p class="loader__note mono">Opening the showroom</p>
  <div class="loader__count">000</div>
  <div class="loader__bar"><i></i></div>
</div>

<canvas id="stage" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>

<main id="view" data-view="shop">
  <div class="shop-head" data-ui>
    <p class="eyebrow">Drop 01 — ten pieces</p>
    <h1 class="display">The Drop</h1>
    <div class="chips" data-chips role="group" aria-label="Filter by category"></div>
  </div>

  <div class="ring-caption" data-ui>
    <button class="arrow" type="button" data-prev aria-label="Previous piece">←</button>
    <div class="ring-caption__body">
      <p class="caption__no" data-no></p>
      <h2 class="caption__name" data-name></h2>
      <p class="caption__meta" data-meta></p>
      <p class="caption__price" data-price></p>
      <a class="btn btn--solid btn--sm" data-link href="shop.html">View piece</a>
    </div>
    <button class="arrow" type="button" data-next aria-label="Next piece">→</button>
  </div>

  <p class="drag-cue mono">Drag or scroll to spin</p>

  <div data-scroll-space></div>

  <ul class="piece-list" data-piece-list aria-label="All pieces in Drop 01"></ul>
</main>

<noscript><p style="padding:140px 24px;color:#141416;font-family:sans-serif">Slang Studio's showroom needs JavaScript to run.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
